# Config inheritance
INHERIT: ../mkdocs.yml

# Project information
site_name: Hello Algo
site_url: https://www.hello-algo.com/vi/
site_description: "Giáo trình nhập môn cấu trúc dữ liệu và giải thuật, minh hoạ bằng hình ảnh động, mã nguồn chạy được ngay"
docs_dir: ../build/vi/docs
site_dir: ../site/vi
# Repository
edit_uri: tree/main/vi/docs
version: 1.3.0

# Configuration
theme:
  custom_dir: ../build/overrides
  language: vi
  font:
    text: Inter
  palette:
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Chế độ tối
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/theme-light-dark
        name: Chế độ sáng

extra:
  status:
    new: Mới cập nhật

